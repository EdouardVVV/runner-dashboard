<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f172a" rx="110"/>

  <!-- Accent glow -->
  <circle cx="256" cy="256" r="200" fill="url(#gradient)" opacity="0.2"/>

  <!-- Runner icon -->
  <path d="M256 100 L280 140 L320 160 L300 200 L280 240 L240 260 L200 240 L180 200 L200 160 L240 140 Z"
        fill="#CCFF00" opacity="0.9"/>

  <circle cx="256" cy="140" r="30" fill="#CCFF00"/>

  <path d="M256 170 L280 220 L300 280" stroke="#CCFF00" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M256 220 L220 260 L200 320" stroke="#CCFF00" stroke-width="20" stroke-linecap="round" fill="none"/>

  <path d="M280 280 L300 340 L280 380" stroke="#00D4FF" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M200 320 L180 360 L200 400" stroke="#00D4FF" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Gradient definition -->
  <defs>
    <radialGradient id="gradient">
      <stop offset="0%" style="stop-color:#CCFF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>

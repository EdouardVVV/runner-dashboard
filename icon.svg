<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background dark -->
  <rect width="512" height="512" fill="#0f172a" rx="110"/>

  <!-- Strava logo (chevrons) en orange -->
  <g transform="translate(256, 300)">
    <!-- Grand chevron Strava -->
    <path d="M-90 40 L0 -140 L90 40 L52 40 L0 -64 L-52 40 Z" fill="#FC4C02"/>
    <!-- Petit chevron Strava (inversé, plus clair) -->
    <path d="M22 40 L58 112 L94 40 L122 40 L58 168 L-6 40 Z" fill="#FDA580"/>
  </g>

  <!-- Coureur au-dessus du logo -->
  <g transform="translate(256, 130)" fill="#CCFF00">
    <!-- Tête -->
    <circle cx="14" cy="-52" r="17"/>
    <!-- Torse penché avant -->
    <path d="M8 -36 L-8 8 L4 12 L20 -32 Z"/>
    <!-- Bras avant levé -->
    <path d="M12 -28 L44 -14 L40 -4 L6 -18 Z"/>
    <!-- Bras arrière -->
    <path d="M2 -24 L-30 -34 L-27 -44 L6 -34 Z"/>
    <!-- Jambe avant pliée (genou levé) -->
    <path d="M-4 6 L30 22 L46 52 L36 58 L20 30 L-10 16 Z"/>
    <!-- Jambe arrière tendue -->
    <path d="M-6 8 L-38 34 L-58 28 L-54 18 L-38 24 L-14 2 Z"/>
  </g>
</svg>
